ight: 1.45; margin-top: 8px">Нажал «Записать» → шторка уходит, «+40 XP» вылетает,<br>множители мелкими бейджами, число летит к полоске уровня — та вспыхивает и дорастает. ≈0,6 с на полёт.</span></div>
